[package]
name = "deskway"
version = "0.1.2"
edition = "2021"
license.workspace = true
publish = false

[[bin]]
name = "deskway"
path = "src/main.rs"

[dependencies]
deskway-wire = { path = "../crates/wire" }
deskway-peer = { path = "../crates/peer" }
deskway-server-connection = { path = "../crates/server" }
str0m = { workspace = true }
anyhow = "1"
base64 = "0.22"
http = "1"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = { version = "0.12", default-features = false }
tungstenite = { version = "0.27", features = ["native-tls"] }
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
socket2 = "0.5"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_System_Memory", "Win32_System_Threading"]

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
