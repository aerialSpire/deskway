[package]
name = "deskway-peer"
version = "0.1.2"
edition = "2021"
license.workspace = true
publish = false

[lib]
name = "peer"
doctest = false

[dependencies]
deskway-wire = { path = "../wire" }
anyhow = "1"
hmac = "0.12"
if-addrs = "0.13"
md-5 = "0.10"
native-tls = "0.2"
serde_json = "1"
sha1 = "0.10"
# The TCP relay's send buffer is kept small (turn), which std cannot set.
socket2 = "0.5"
str0m = { workspace = true }

# The platform's own crypto backs DTLS; the host uses the same str0m.
[target.'cfg(windows)'.dependencies]
str0m = { workspace = true, features = ["wincrypto"] }
# The machine id an AI client gives as where it is (here).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Registry"] }

[target.'cfg(target_os = "macos")'.dependencies]
str0m = { workspace = true, features = ["apple-crypto"] }

# dimpl drives the DTLS handshake using the system OpenSSL already used by native-tls.
[target.'cfg(target_os = "linux")'.dependencies]
str0m = { workspace = true, features = ["openssl-dimpl"] }
