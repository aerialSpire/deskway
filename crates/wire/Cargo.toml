[package]
name = "deskway-wire"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[lib]
name = "wire"
doctest = false

[features]
# The tables of wire names and the readers of proto/messages.json and proto/vectors.json, for
# the contract tests of the crates that build on these types.
contract = []

[dependencies]
base64 = "0.22"
getrandom = "0.2"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
