<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deskway Host</title>
<!--design-->
<!--lang-menu-->
<!--page-->
<style>
/* The panel: a top bar, the content (the only part that scrolls), a bottom bar. Tokens and shared
   components come from design.css (docs/design.md). */
html, body { height: 100%; background: var(--surface); }
body { display: flex; flex-direction: column; user-select: none; overflow: hidden; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.main { flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--s5) var(--s4); scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.head { flex: none; padding: var(--s4) var(--s2) var(--s2) var(--s5); display: flex; align-items: flex-start; gap: var(--s2); }
.head-text { flex: 1; min-width: 0; padding-top: var(--s1); }
/* A bar's title is one line: a name too long ends in …; a count after it always shows whole. */
.head h1 { font-size: var(--fs-title); line-height: var(--lh-tight); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head.page h1, .dh h2 { display: flex; align-items: baseline; gap: var(--s1); min-width: 0; }
.head.page h1 > span:first-child, .dh h2 > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.head.page h1 .n, .dh h2 .n { flex: none; }
.head .status { margin-top: var(--s1); font-size: var(--fs-small); }
/* The bar's buttons centre on the title's line. */
.head-end { flex: none; display: flex; align-items: center; gap: var(--s1); margin-top: calc(var(--s1) + (var(--fs-title) * var(--lh-tight) - var(--h-compact)) / 2); }
#leave-error { flex: 1; min-height: 0; margin: 0; }
/* Who this computer belongs to; the server's address under the pointer. */
.account { flex: 1; min-width: 0; color: var(--quiet); font-size: var(--fs-small); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.leave-confirm { flex: 1; }
.leave-confirm .confirm { margin: 0; }
.foot { flex: none; min-height: 52px; padding: var(--s2) var(--s3) var(--s2) var(--s5); display: flex; align-items: center; justify-content: flex-end; gap: var(--s3); border-top: 1px solid var(--line); }
[data-window-drag] { cursor: grab; }
.sub { margin-top: var(--s1); color: var(--quiet); font-size: var(--fs-small); }
/* The sign-in's fields start below its line, as the web's do below its title. */
#login .fields { margin-top: var(--s5); }
.problem { margin-top: var(--s2); color: var(--danger); font-size: var(--fs-caption); line-height: var(--lh-body); overflow-wrap: anywhere; white-space: pre-line; user-select: text; }
#running > .btn { margin-top: var(--s3); }
.ai-row { margin-top: var(--s3); padding: var(--s2) var(--s3); display: flex; align-items: center; gap: var(--s2); border: 1px solid var(--line); border-radius: var(--r-box); background: var(--surface); line-height: var(--lh-tight); }
.ai-row[hidden] { display: none; }
.ai-row > #ai-line { flex: 1; min-width: 0; }
.ai-row > .btn { flex: none; }
.ai-row > .dot { background: var(--warn); }
.ai-row > .dot.off { display: none; }
.hub-row { margin-top: var(--s3); padding: var(--s2) var(--s2) var(--s2) var(--s3); display: flex; align-items: center; gap: var(--s2); border: 1px solid var(--line); border-radius: var(--r-box); line-height: var(--lh-tight); }
.hub-row > .text { flex: 1; min-width: 0; font-size: var(--fs-small); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hub-row > .btn { flex: none; }
.hub-row.bad { border-color: var(--danger-line); background: var(--danger-soft); }
.hub-row.bad > .text { color: var(--danger); white-space: normal; }
.local-alternative { margin-top: var(--s5); padding-top: var(--s4); border-top: 1px solid var(--line); }
.local-alternative .note { margin-top: var(--s2); line-height: var(--lh-body); }
#local-confirm .spinner { width: 12px; height: 12px; border-color: color-mix(in srgb, var(--on-accent) 35%, transparent); border-top-color: var(--on-accent); }
#local-stop-options { margin-top: var(--s4); }
#local-stop-options .note { margin-left: var(--s6); margin-top: var(--s1); }
#local-dialog-error { margin-top: var(--s3); }

/* Settings */
.sec { margin-top: var(--s4); color: var(--quiet); font-size: var(--fs-caption); font-weight: 400; }
.row { min-height: var(--h-control); padding: var(--s2) 0; display: flex; align-items: center; justify-content: space-between; gap: var(--s3); border-bottom: 1px solid var(--line); line-height: var(--lh-tight); }
.note { display: block; margin-top: var(--s1); color: var(--quiet); font-size: var(--fs-caption); }
.row .btn.text { margin-left: calc(-1 * var(--s3)); }
#running .confirm { margin-top: var(--s2); }

/* Devices: a header, at most three, the way to all of them */
.dh { margin-top: var(--s5); padding-bottom: var(--s2); display: flex; align-items: center; justify-content: space-between; gap: var(--s2); border-bottom: 1px solid var(--line-strong); }
.dh h2, .head h1 .n { font-size: var(--fs-body); font-weight: 400; line-height: var(--lh-tight); }
.n { color: var(--quiet); font-weight: 300; }
.dev { min-height: 52px; padding: var(--s1) 0; display: flex; align-items: center; justify-content: space-between; gap: var(--s3); border-bottom: 1px solid var(--line); }
.dev.new { background: var(--accent-soft); }
.dn { min-width: 0; display: flex; flex-direction: column; line-height: var(--lh-tight); }
.dn b { font-size: var(--fs-small); font-weight: 400; overflow-wrap: anywhere; }
.dn .dname { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
.dn .dname > .tag { flex: none; }
.dn span { font-size: var(--fs-caption); color: var(--quiet); }
.dn span.live { color: var(--ok); }
.found { margin-top: var(--s4); }
.found h2 { color: var(--quiet); font-size: var(--fs-caption); font-weight: 400; }
.found-box { --found-row: 52px; margin-top: var(--s2); height: calc(var(--found-row) + 2px); overflow: hidden; border: 1px solid var(--line); border-radius: var(--r-box); }
.found-box.many { height: auto; max-height: calc(2.5 * var(--found-row) + 2px); overflow-y: auto; }
.found-state { height: 100%; display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s2) 0 var(--s3); color: var(--quiet); font-size: var(--fs-caption); }
.found-state span:last-of-type { flex: 1; }
.found-state[hidden] { display: none; }
.found-box .dev { width: 100%; height: var(--found-row); min-height: 0; padding: 0 var(--s3); border: 0; border-bottom: 1px solid var(--line); border-radius: 0; color: var(--ink); text-align: start; }
.found-box .dev:focus-visible { outline-offset: -2px; }
.found-box .dev:last-child { border-bottom: 0; }
.found-box .dev[aria-pressed="true"] { background: var(--accent-soft); }
.found-box .dn > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.found-box .pick { flex: none; color: var(--quiet); font-size: var(--fs-caption); }
.found-box .dev[aria-pressed="true"] .pick { color: var(--accent); }
.all { margin-top: var(--s1); display: flex; justify-content: flex-end; }
.empty { margin-top: var(--s3); padding: var(--s4); border: 1px dashed var(--line-strong); border-radius: var(--r-box); text-align: center; }
.empty p { color: var(--quiet); font-size: var(--fs-small); }
.empty .title { color: var(--ink); font-size: var(--fs-body); font-weight: 400; }
.empty .btn { margin-top: var(--s3); }

/* The device page */
.head.page { align-items: center; padding: var(--s2); border-bottom: 1px solid var(--line); }
.head.page h1 { flex: 1; min-width: 0; font-size: var(--fs-subtitle); font-weight: 400; }
.search { flex: none; padding: var(--s3) var(--s5) var(--s1); }
.search .input { height: var(--h-compact); font-size: var(--fs-small); }
.foot.page { justify-content: space-between; }

/* The add dialog, while a pairing window is open */
.dialog .lead { margin-top: var(--s3); color: var(--ink); text-align: center; }
.dialog .wait { margin-top: var(--s3); display: flex; align-items: center; gap: var(--s2); color: var(--quiet); font-size: var(--fs-caption); }
.dialog .more { margin-top: var(--s3); padding-top: var(--s3); border-top: 1px solid var(--line); color: var(--quiet); font-size: var(--fs-caption); }
.meter { margin-top: var(--s3); display: flex; align-items: baseline; gap: var(--s2); }
.meter b { font-size: var(--fs-display); font-weight: 300; line-height: 1; }
.meter span { color: var(--quiet); font-size: var(--fs-small); }

/* macOS: permissions, and the login item left behind after signing out */
#permissions { margin-top: var(--s3); padding: var(--s2) var(--s3); border: 1px solid var(--danger-line); border-radius: var(--r-box); background: var(--danger-soft); color: var(--danger); }
#permissions p { font-size: var(--fs-small); }
.permission-row { min-height: var(--h-compact); display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
.permission-granted { color: var(--ok); font-size: var(--fs-small); }
.toast { position: fixed; left: 50%; bottom: 68px; transform: translateX(-50%); max-width: calc(100% - var(--s8)); }
</style>
</head>
<body>
<div class="loading" id="loading" role="status"><span class="spinner" aria-hidden="true"></span><span data-i18n="panel.loading"></span></div>

<div class="view" id="home" hidden>
  <header class="head" data-window-drag>
    <div class="head-text" data-window-drag>
      <h1 id="title" data-window-drag></h1>
      <div class="status" id="status-line"><span class="dot" id="dot" aria-hidden="true"></span><span id="status"></span></div>
    </div>
    <div class="head-end">
      <div id="lang"></div>
      <button class="btn icon compact" id="minimize" type="button" data-i18n-attr="aria-label=panel.minimize_aria" hidden><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M1 6h10"/></svg></button>
      <button class="btn icon compact" id="close" type="button" data-i18n-attr="aria-label=panel.close_aria"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11"/></svg></button>
    </div>
  </header>
  <div class="main">
    <div class="hub-row" id="local-status" role="status" hidden>
      <span class="dot ok" id="local-dot" aria-hidden="true"></span><span class="spinner" id="local-spinner" aria-hidden="true"></span>
      <span class="text" id="local-line"></span>
      <button class="btn compact" type="button" id="local-open" aria-describedby="local-link-note"></button>
      <button class="btn compact" type="button" id="local-stop" data-i18n="local.stop"></button>
    </div>
    <p class="note" id="local-link-note" data-i18n="local.link_restricted" hidden></p>
    <div class="problem" id="local-error" role="alert" hidden></div>
    <form id="login" hidden>
      <p class="sub" id="login-help" data-i18n="login.help"></p>
      <section class="found" aria-labelledby="found-title">
        <h2 id="found-title" data-i18n="login.found_title"></h2>
        <div class="found-box" id="found-box">
          <div class="found-state" id="found-searching" role="status" hidden>
            <span class="spinner" aria-hidden="true"></span><span data-i18n="login.found_searching"></span>
          </div>
          <div class="found-state" id="found-none">
            <span class="dot" aria-hidden="true"></span><span role="status" data-i18n="login.found_none"></span>
            <button class="btn text compact" id="find-again" type="button" data-i18n="login.found_retry"></button>
          </div>
          <div id="found-servers" hidden></div>
        </div>
      </section>
      <div class="fields">
        <label><span data-i18n="login.server"></span><input class="input" id="server" required></label>
        <label><span data-i18n="login.user"></span><input class="input" id="user" autocomplete="username" required></label>
        <label><span data-i18n="login.password"></span><input class="input" id="password" type="password" autocomplete="current-password" required></label>
      </div>
      <div class="error" id="error" role="alert"></div>
      <button class="btn primary block" id="submit" type="submit" data-i18n="login.submit"></button>
      <div class="local-alternative" id="local-alternative" hidden>
        <button class="btn block" id="local-signed-out" type="button" data-i18n="local.run_here"></button>
        <span class="note" id="local-alternative-note"></span>
      </div>
    </form>

    <div class="problem" id="problem" role="status" hidden></div>
    <div id="running" hidden>
      <button class="btn primary block" id="end" type="button" hidden></button>
      <div class="ai-row" id="ai-row" hidden><span class="dot" id="ai-dot" aria-hidden="true"></span><span id="ai-line"></span><button class="btn compact" id="stop-ai" type="button"></button></div>
      <button class="btn primary block" id="start-service" type="button" hidden data-i18n="panel.start_service"></button>
      <h2 class="sec" data-i18n="panel.settings"></h2>
      <div class="row" id="local-setting" hidden>
        <span><span data-i18n="local.run"></span><span class="note" id="local-setting-note"></span></span>
        <button class="switch" id="local-switch" type="button" role="switch" data-i18n-attr="aria-label=local.run" aria-describedby="local-setting-note"><span></span></button>
      </div>
      <!-- Windows: the services' start type. macOS: the login item. -->
      <div id="autostart-row" class="row" hidden>
        <span><span id="autostart-label" data-i18n="panel.autostart"></span><span class="note" id="autostart-note" role="status"></span>
          <button class="btn text compact" id="login-settings" type="button" hidden data-i18n="mac.login_settings"></button>
        </span>
        <button class="switch" id="autostart" type="button" role="switch" data-i18n-attr="aria-label=panel.autostart" aria-describedby="autostart-note"><span></span></button>
      </div>
      <div class="confirm" id="autostart-confirm" role="alertdialog" hidden>
        <p data-i18n="panel.autostart_confirm"></p>
        <div class="actions"><button class="btn compact" id="autostart-no" type="button" data-i18n="common.cancel"></button><button class="btn compact danger primary" id="autostart-yes" type="button" data-i18n="panel.autostart_off"></button></div>
      </div>
      <!-- Directly under starting with the computer, on every platform. -->
      <div id="prevent-sleep-row" class="row" hidden><span><span data-i18n="panel.prevent_sleep"></span><span class="note" id="prevent-sleep-note"></span></span><button class="switch" id="prevent-sleep" type="button" role="switch" data-i18n-attr="aria-label=panel.prevent_sleep" aria-describedby="prevent-sleep-note"><span></span></button></div>
      <div id="lock-row" class="row"><span data-i18n="panel.lock"></span><button class="switch" id="lock" type="button" role="switch" data-i18n-attr="aria-label=panel.lock"><span></span></button></div>

      <div id="device-settings">
      <div class="dh"><h2><span data-i18n="panel.devices_title"></span> <span class="n" id="count"></span></h2><button class="btn compact" id="add" type="button" data-i18n="panel.add"></button></div>
      <div id="overview"></div>
      <div class="all"><button class="btn text compact" id="see-all" type="button" hidden></button></div>
      <div class="empty" id="no-devices" hidden>
        <p class="title" data-i18n="panel.no_devices_title"></p>
        <p data-i18n="panel.no_devices_text"></p>
        <button class="btn primary block" id="add-first" type="button" data-i18n="panel.pair"></button>
      </div>
      </div>
    </div>

    <section id="mac" hidden>
      <div id="mac-permissions" hidden>
        <div id="permissions" role="group" data-i18n-attr="aria-label=mac.permissions_aria" hidden>
          <p id="permission-request" role="status"></p>
          <div class="permission-row">
            <button class="btn text compact" id="screen-request" type="button" data-i18n="mac.screen_request"></button>
            <span class="permission-granted" id="screen-granted" hidden data-i18n="mac.screen_granted"></span>
            <button class="btn text compact" id="screen-settings" type="button" hidden data-i18n="mac.screen_settings"></button>
          </div>
          <div class="permission-row">
            <button class="btn text compact" id="accessibility-request" type="button" data-i18n="mac.accessibility_request"></button>
            <span class="permission-granted" id="accessibility-granted" hidden data-i18n="mac.accessibility_granted"></span>
            <button class="btn text compact" id="accessibility-settings" type="button" hidden data-i18n="mac.accessibility_settings"></button>
          </div>
          <button class="btn text compact" id="reopen-for-permissions" type="button" hidden data-i18n="mac.reopen"></button>
        </div>
        <div class="row" role="group" aria-labelledby="full-disk-access-label">
          <div>
            <div class="permission-row">
              <span id="full-disk-access-label" data-i18n="mac.full_disk_access"></span>
              <span class="note" id="full-disk-access-status" role="status"></span>
            </div>
            <div id="full-disk-access-offer">
              <p class="note" data-i18n="mac.full_disk_access_hint"></p>
              <button class="btn text compact" id="full-disk-access-settings" type="button" data-i18n="mac.full_disk_access_settings"></button>
            </div>
          </div>
        </div>
      </div>
      <div id="login-cleanup" hidden>
        <p class="sub" id="login-cleanup-status" role="status"></p>
        <button class="btn text compact" id="login-cleanup-retry" type="button" data-i18n="mac.login_cleanup_retry"></button>
      </div>
      <div class="error" id="mac-error" role="alert" hidden></div>
    </section>
  </div>
  <footer class="foot" id="foot" hidden><span class="account" id="account"></span><span class="error" id="leave-error" role="alert"></span><button class="btn text compact" id="leave" type="button" data-i18n="panel.sign_out"></button><div class="leave-confirm" id="leave-confirm" hidden></div></footer>
</div>

<div class="overlay" id="local-overlay" hidden>
  <section class="dialog" id="local-dialog" role="alertdialog" aria-modal="true" aria-labelledby="local-title" aria-describedby="local-body">
    <h2 id="local-title"></h2>
    <p id="local-body"></p>
    <p id="local-note"></p>
    <div id="local-stop-options" hidden>
      <label class="check">
        <input type="checkbox" id="local-stop-delete" aria-describedby="local-stop-delete-note">
        <span data-i18n="local.stop_delete"></span>
      </label>
      <p class="note" id="local-stop-delete-note" data-i18n="local.stop_delete_note"></p>
    </div>
    <div class="error" id="local-dialog-error" role="alert" hidden></div>
    <div class="dialog-actions">
      <button class="btn" id="local-cancel" type="button" data-i18n="common.cancel"></button>
      <button class="btn primary" id="local-confirm" type="button"><span class="spinner" aria-hidden="true" hidden></span><span></span></button>
    </div>
  </section>
</div>

<!-- Every device, in the same window: only the list scrolls. -->
<div class="view" id="devices-view" hidden>
  <header class="head page" data-window-drag>
    <button class="btn icon compact" id="back" type="button" data-i18n-attr="aria-label=panel.back"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M9 2L4 7l5 5"/></svg></button>
    <h1 data-window-drag><span data-i18n="panel.devices_title"></span> <span class="n" id="all-count"></span></h1>
    <button class="btn icon compact" id="close2" type="button" data-i18n-attr="aria-label=panel.close_aria"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11"/></svg></button>
  </header>
  <div class="search" id="search-wrap" hidden><input class="input" id="search" type="search" data-i18n-attr="aria-label=panel.search,placeholder=panel.search"></div>
  <div class="main" id="all-devices"></div>
  <footer class="foot page">
    <button class="btn primary compact" id="add2" type="button" data-i18n="panel.add"></button>
    <button class="btn text compact danger" id="unpair" type="button" data-i18n="panel.remove_all"></button>
  </footer>
</div>

<div class="overlay" id="unpair-overlay" hidden>
  <section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="unpair-title" aria-describedby="unpair-message">
    <h2 id="unpair-title" data-i18n="panel.remove_all"></h2>
    <p id="unpair-message" data-i18n="panel.remove_all_confirm"></p>
    <div class="dialog-actions"><button class="btn" id="unpair-cancel" type="button" data-i18n="common.cancel"></button><button class="btn danger primary" id="unpair-confirm" type="button" data-i18n="common.remove"></button></div>
  </section>
</div>

<!-- Adding a device: the QR code; it closes by itself once the device is added. -->
<div class="overlay" id="add-overlay" hidden>
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="add-title">
    <h2 id="add-title" data-i18n="panel.pair"></h2>
    <div class="qr" id="qr-img"></div>
    <p class="lead" data-i18n="panel.qr_title"></p>
    <p data-i18n="panel.qr_help"></p>
    <div class="wait" role="status"><span class="spinner" aria-hidden="true"></span><span data-i18n="panel.qr_wait"></span></div>
    <div class="dialog-actions"><button class="btn" id="add-close" type="button" data-i18n="common.close"></button></div>
  </section>
</div>

<!-- No room for another device. -->
<div class="overlay" id="full-overlay" hidden>
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="full-title">
    <h2 id="full-title" data-i18n="panel.full_title"></h2>
    <div class="meter"><b id="full-n"></b><span id="full-of"></span></div>
    <p id="full-text"></p>
    <div class="dialog-actions"><button class="btn" id="full-close" type="button" data-i18n="common.close"></button><button class="btn primary" id="full-manage" type="button" data-i18n="panel.manage"></button></div>
  </section>
</div>

<!-- A device asks to be let in: over everything, one at a time. -->
<div class="overlay" id="ask-overlay" hidden>
  <section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="ask-title" aria-describedby="ask-body">
    <h2 id="ask-title"></h2>
    <p id="ask-body"></p>
    <div class="code" id="ask-code"></div>
    <div class="dialog-actions"><button class="btn" id="ask-deny" type="button" data-i18n="ask.deny"></button><button class="btn primary" id="ask-allow" type="button" data-i18n="ask.allow"></button></div>
    <p class="more" id="ask-more" hidden></p>
  </section>
</div>

<div class="notice dark toast" id="toast" role="status" hidden></div>

<script>
followLanguage(() => {
  if (window.last) window.render(window.last);
  renderLocalServers();
}, $('lang'));

const button = (label, cls, f) => { const b = h('button', { class: cls, type: 'button' }, label); b.onclick = f; return b; };

let localServers = [];
let searchTimer;
// The server field holds the address. This tracks how it was filled.
let serverChoice = 'untouched';

function renderLocalServers() {
  const field = $('server');
  const searching = searchTimer !== undefined;
  const servers = searching ? [] : localServers;
  if (serverChoice === 'untouched' || serverChoice === 'auto') {
    if (servers.length === 1) {
      field.value = servers[0].address;
      serverChoice = 'auto';
    } else if (serverChoice === 'auto') {
      field.value = '';
      serverChoice = 'untouched';
    }
  }
  $('found-searching').hidden = !searching;
  $('found-none').hidden = searching || servers.length > 0;
  $('found-servers').hidden = servers.length === 0;
  $('found-box').classList.toggle('many', servers.length > 1);
  const rows = $('found-servers');
  const focused = document.activeElement.dataset.address;
  const buttons = servers.map(({ name, address }) => {
    const chosen = serverChoice !== 'typed' && field.value === address;
    const origin = address.split('#', 1)[0];
    const row = h('button', { type: 'button', class: 'btn text dev', 'aria-pressed': String(chosen), 'data-address': address },
      h('span', { class: 'dn' }, h('b', { title: name }, name), h('span', { title: origin }, origin)),
      h('span', { class: 'pick' }, t(chosen ? 'login.found_chosen' : 'login.found_choose')));
    row.onclick = () => {
      field.value = address;
      serverChoice = 'manual';
      renderLocalServers();
    };
    return row;
  });
  rows.replaceChildren(...buttons);
  buttons.find((row) => row.dataset.address === focused)?.focus({ preventScroll: true });
}

window.showLocalServers = (servers) => {
  localServers = servers;
  renderLocalServers();
};

window.searchLocalServers = (on) => {
  clearTimeout(searchTimer);
  // Collect the initial results together so a list of several never fills the field.
  searchTimer = on ? setTimeout(() => {
    searchTimer = undefined;
    renderLocalServers();
  }, 2000) : undefined;
  window.showLocalServers([]);
};

// "2 hours ago", in the panel's language.
function ago(secs) {
  const d = Math.max(0, Date.now() / 1000 - secs);
  const fmt = new Intl.RelativeTimeFormat(lang(), { numeric: 'auto' });
  if (d < 60) return fmt.format(0, 'minute');
  for (const [unit, size, next] of [['minute', 60, 60], ['hour', 3600, 24], ['day', 86400, 7], ['week', 604800, 4.35], ['month', 2629800, 12]]) {
    if (d < size * next) return fmt.format(-Math.floor(d / size), unit);
  }
  return fmt.format(-Math.floor(d / 31557600), 'year');
}

// Sign out, asked first in place of its button: the computer leaves the account. On Windows an
// administrator confirms it too (the service holds the sign-in); why it did not happen shows here.
function renderLeave(s) {
  $('foot').hidden = false;

  $('leave').disabled = !!s.busy;

    if (s.local?.state?.own) $('account').textContent += ` · ${t('local.service')}`;

// The one in control first, then the most recently used; never used ones last.
const ordered = (list) => [...list].sort((a, b) => (b.controlling - a.controlling) || (b.used - a.used) || a.name.localeCompare(b.name));

// What this panel is showing: the device page, a device being confirmed, the add dialog.
const ui = { page: 'home', confirm: '', adding: false, known: null, fresh: '', leaving: false };

const localCommand = (action) => send({ cmd: 'local-service', action });
const localUi = { dialog: null, seen: 0, error: '' };

function localDialog(action) {
  localUi.error = '';
  const s = window.last;
  const switching = action === 'start' && s.enrolled && !s.local?.state?.own;
  const server = s.server?.split('#')[0].replace(/^https?:\/\//, '');
  localUi.dialog = { action, switching, hadData: s.local?.state?.has_data, server, usage: null };
  $('local-stop-delete').checked = false;
  if (action === 'stop') localCommand('usage');
  renderLocal(s);
  $('local-cancel').focus();
}

function finishLocalDialog() {
  clearTimeout(localUi.dialog?.timer);
  localUi.dialog = null;
  $('local-overlay').hidden = true;
}

function renderLocal(s) {
  const { state, result, link_allowed } = s.local || {};
  if (result?.id && result.id !== localUi.seen) {
    localUi.seen = result.id;
    const dialog = localUi.dialog;
    if (result.action === 'usage' && dialog?.action === 'stop') {
      dialog.usage = result;
    } else if (result.action === 'stop_and_delete' && result.action === dialog?.request && result.error) {
      clearTimeout(dialog.timer);
      dialog.request = null;
      dialog.spinning = false;
      dialog.error = result.error;
    } else {
      if (result.action === dialog?.request) finishLocalDialog();
      if (result.error) localUi.error = result.error;
    }
  }
  const visible = !!state && state.phase !== 'off';
  const failed = state?.phase === 'failed';
  const starting = state?.phase === 'starting';
  const setup = state?.phase === 'setup';
  const restricted = visible && !starting && !failed && link_allowed === false;
  $('local-status').hidden = !visible;
  $('local-status').classList.toggle('bad', failed);
  $('local-dot').hidden = failed || starting || !visible;
  $('local-spinner').hidden = !starting;
  $('local-line').textContent = visible ? (failed && state.port ? t('local.port_taken', { port: state.port })
    : failed && state.error ? t('local.failure_reason', { reason: state.error })
    : state.setup_error ? t('local.setup_error', { reason: state.setup_error })
    : t(failed ? 'local.exited' : starting ? 'local.starting' : setup ? 'local.setup' : 'local.running')) : '';
  $('local-open').hidden = !visible || starting;
  $('local-open').disabled = restricted;
  $('local-link-note').hidden = !restricted;
  $('local-open').textContent = t(failed ? 'local.retry' : (setup && !state.admin_ready) ? 'local.complete_setup' : 'local.view');
  $('local-stop').hidden = !visible || starting || failed;
  $('local-setting').hidden = !state;
  $('local-switch').disabled = !state?.available || !!localUi.dialog?.request || !!s.busy;
  $('local-switch').setAttribute('aria-checked', !!state?.enabled);
  $('local-setting-note').textContent = t(state?.available ? 'local.note' : 'local.unavailable');
  $('local-alternative').hidden = !state || !!state.enabled;
  $('local-signed-out').disabled = !state?.available || !!s.busy;
  $('local-alternative-note').textContent = t(state?.available ? 'local.note' : 'local.unavailable');
  $('local-error').hidden = !localUi.error;
  $('local-error').textContent = localUi.error;

  const dialog = localUi.dialog;
  $('local-overlay').hidden = !dialog;
  if (!dialog) return;
  const { action, switching, server, hadData, usage, request, spinning } = dialog;
  const start = action === 'start';
  const deleting = !start && $('local-stop-delete').checked;
  const bodyKey = start ? (switching ? 'local.switch_body' : hadData ? 'local.resume_body' : 'local.start_body')
    : 'local.stop_body';
  const noteKey = start ? (switching ? 'local.switch_note' : 'local.start_note') : deleting ? '' : 'local.stop_note';
  const count = (key, n) => t(`local.${key}.${n === 1 ? 'one' : 'other'}`, { n });
  $('local-title').textContent = t(switching ? 'local.switch_title' : `local.${action}_title`);
  let body = t(bodyKey, { server });
  if (!start && typeof usage?.computers === 'number') {
    const { computers, browsers } = usage;
    if (computers && browsers) {
      body = t('local.stop_usage', { computers: count('computers', computers), browsers: count('browsers', browsers) });
    } else if (computers || browsers) {
      const n = computers || browsers;
      body = t(`local.stop_usage_single.${n === 1 ? 'one' : 'other'}`, { count: count(computers ? 'computers' : 'browsers', n) });
    } else {
      body = t('local.stop_usage_none');
    }
  }
  $('local-body').textContent = body;
  $('local-note').hidden = !noteKey;
  $('local-note').textContent = noteKey ? t(noteKey, { server }) : '';
  $('local-stop-options').hidden = start;
  $('local-stop-delete').disabled = !!request;
  $('local-dialog-error').hidden = !dialog.error;
  $('local-dialog-error').textContent = dialog.error || '';
  $('local-dialog').setAttribute('aria-busy', !!spinning);
  $('local-confirm').classList.toggle('danger', !start);
  $('local-confirm').disabled = !!request || (!start && !usage);
  $('local-cancel').disabled = !!request;
  $('local-confirm').firstElementChild.hidden = !spinning;
  $('local-confirm').lastElementChild.textContent = t(spinning
    ? (start ? 'local.starting_button' : 'local.stopping_button')
    : (start ? 'local.run' : deleting ? 'local.stop_delete_button' : 'local.stop_title_button'));
}

// The add dialog shows the QR code while a pairing window is open; a device that appears
// meanwhile closes it and is said by name.
function renderAdding(s) {
  const ids = (s.devices || []).map((d) => d.id);
  if (ui.adding && ui.known) {
    const added = (s.devices || []).find((d) => !ui.known.includes(d.id));
    if (added) {
      ui.adding = false;
      ui.fresh = added.id;
      send({ cmd: 'pair-stop' });
      toast(t('panel.added', { name: added.name }));
      setTimeout(() => { ui.fresh = ''; if (window.last) window.render(window.last); }, 2000);
    }
  }
  // The pairing window closed by itself (it expired): so does the dialog.
  if (ui.adding && s.pair_qr) ui.sawQr = true;
  if (ui.adding && ui.sawQr && !s.pair_qr) ui.adding = false;
  if (!ui.adding) { ui.known = ids; ui.sawQr = false; }
  $('add-overlay').hidden = !ui.adding;
  // The QR code is made by this program from its own pairing link, never from outside input.
  if ($('qr-img').dataset.svg !== (s.pair_qr || '')) { $('qr-img').innerHTML = s.pair_qr || ''; $('qr-img').dataset.svg = s.pair_qr || ''; }
}

function startAdding() {

    : (s.autostart ? '' : t('panel.autostart_off_note'));
  $('autostart-note').hidden = !$('autostart-note').textContent;
  $('login-settings').hidden = !(mac && mac.login === 'approval');
  if (localOn || s.autostart === false) $('autostart-confirm').hidden = true;
  // Keep-awake, directly under it, wherever the host runs.

  // A failure has a reason; "connecting" forever without one helps nobody.

  $('dot').className = `dot ${dot}`;

  // AI clients here: who controls this computer now (and Disconnect), or that they may (and Stop

  const ai = s.ai_client ? t('panel.ai_using', { name: s.ai_client }) : s.ai_state === 'on' ? t('panel.ai_on') : s.ai_state === 'stopped' ? t('panel.ai_stopped') : '';
  $('ai-row').hidden = !ai;

  $('stop-ai').hidden = s.ai_state !== 'on';
  $('stop-ai').textContent = s.ai_client ? t('overlay.disconnect') : t('panel.stop_ai');
  renderLocal(s);
};

const showPage = (page) => { ui.page = page; ui.confirm = ''; if (window.last) window.render(window.last); };

// AppKit needs the title's hit area before it dispatches mouse-down to the WebView.
function observeMacDragRegion() {
  const titles = [...document.querySelectorAll('#home .head-text, #devices-view h1')];
  const popups = [...document.querySelectorAll('.overlay, #lang .menu')];
  let previous;
  const update = () => {
    const title = titles.find((el) => el.getClientRects().length);
    const r = !popups.some((el) => !el.hidden) && title?.getBoundingClientRect();
    const rect = r ? [r.left, r.top, r.right, r.bottom] : null;
    const next = JSON.stringify(rect);
    if (previous !== next) {
      previous = next;
      send({ cmd: 'drag-region', rect });
    }
  };
  const sizes = new ResizeObserver(update);
  titles.forEach((el) => sizes.observe(el));
  const visibility = new MutationObserver(update);
  popups.forEach((el) => visibility.observe(el, { attributeFilter: ['hidden'] }));
}

$('local-open').onclick = () => {
  const { phase, admin_ready } = window.last.local.state;
  localUi.error = '';
  localCommand(phase === 'failed' ? 'retry' : (phase === 'setup' && !admin_ready) ? 'setup' : 'open');
};
$('local-cancel').onclick = finishLocalDialog;
$('local-confirm').onclick = () => {
  const dialog = localUi.dialog;
  if (!dialog || dialog.request) return;
  dialog.request = dialog.action === 'stop' && $('local-stop-delete').checked ? 'stop_and_delete' : dialog.action;
  dialog.error = '';
  dialog.timer = setTimeout(() => {
    dialog.spinning = true;
    renderLocal(window.last);
  }, 300);
  renderLocal(window.last);
  localCommand(dialog.request);
};
$('server').addEventListener('input', () => {
  serverChoice = 'typed';
  renderLocalServers();
});
$('login').addEventListener('submit', (e) => {
  e.preventDefault();
  send({ cmd: 'login', server: $('server').value.trim(), user: $('user').value.trim(), password: $('password').value });
  $('password').value = '';
});
$('end').addEventListener('click', () => send({ cmd: 'disconnect' }));
$('stop-ai').addEventListener('click', () => send({ cmd: 'stop-ai' }));
$('lock').addEventListener('click', () => send({ cmd: 'lock', on: $('lock').getAttribute('aria-checked') !== 'true' }));
// On Windows turning it off is asked first, in the panel; turning it back on is not.
$('autostart').addEventListener('click', () => {
  const on = $('autostart').getAttribute('aria-checked') === 'true';
  if (on && !(window.last && window.last.mac)) $('autostart-confirm').hidden = false;
  else send({ cmd: 'autostart', on: !on });
});
$('prevent-sleep').addEventListener('click', () => send({ cmd: 'prevent-sleep', on: $('prevent-sleep').getAttribute('aria-checked') !== 'true' }));
$('autostart-no').addEventListener('click', () => { $('autostart-confirm').hidden = true; });
$('autostart-yes').addEventListener('click', () => { $('autostart-confirm').hidden = true; send({ cmd: 'autostart', on: false }); });
$('start-service').addEventListener('click', () => send({ cmd: 'start-service' }));
$('leave').addEventListener('click', () => { ui.leaving = true; if (window.last) window.render(window.last); });
for (const id of ['add', 'add2', 'add-first']) $(id).addEventListener('click', startAdding);
$('add-close').addEventListener('click', () => { ui.adding = false; send({ cmd: 'pair-stop' }); if (window.last) window.render(window.last); });
$('full-close').addEventListener('click', () => { $('full-overlay').hidden = true; });
$('full-manage').addEventListener('click', () => { $('full-overlay').hidden = true; showPage('devices'); });
$('see-all').addEventListener('click', () => showPage('devices'));
$('back').addEventListener('click', () => showPage('home'));
$('search').addEventListener('input', () => { if (window.last) renderDevices(window.last); });
// Lost phone or laptop: every passkey must pair again, here at this computer.
$('unpair').addEventListener('click', () => { $('unpair-overlay').hidden = false; });
$('unpair-cancel').addEventListener('click', () => { $('unpair-overlay').hidden = true; });
$('unpair-confirm').addEventListener('click', () => { $('unpair-overlay').hidden = true; send({ cmd: 'unpair' }); });
for (const cmd of ['screen-request', 'accessibility-request', 'screen-settings', 'accessibility-settings', 'full-disk-access-settings', 'login-settings', 'reopen-for-permissions']) {
  $(cmd).addEventListener('click', () => send({ cmd }));
}
$('login-cleanup-retry').addEventListener('click', () => send({ cmd: 'autostart', on: false }));
send({ cmd: 'ready' });
</script>
</body>
</html>
