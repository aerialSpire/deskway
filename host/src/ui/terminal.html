<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--design-->
<link rel="stylesheet" href="./vendor/xterm.css">
<style>
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--surface); }
.tabs { display: flex; align-items: center; gap: var(--s1); padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab {
  flex: none; height: var(--h-compact); padding: 0 var(--s3); display: inline-flex; align-items: center; gap: var(--s2);
  border: 0; border-radius: var(--r-control); background: transparent; color: var(--ink); font-size: var(--fs-small);
  font-weight: 300; white-space: nowrap; cursor: pointer;
}
.tab:hover { background: var(--hover); }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 400; }
.tab .who { color: var(--warn); }
.tab .x {
  width: var(--h-inline-icon); height: var(--h-inline-icon); display: inline-flex; align-items: center; justify-content: center;
  padding: 0; border: 0; border-radius: var(--r-inline-icon); background: transparent; color: var(--quiet);
}
.tab.add { width: var(--h-compact); padding: 0; justify-content: center; color: var(--quiet); }
.term {
  display: flex; flex-direction: column; flex: 1; min-height: 0; margin: var(--s2); padding: var(--s2) var(--s3);
  border-radius: var(--r-box); background: var(--screen);
}
#emulator { flex: 1; min-height: 0; font-size: var(--fs-body); }
#status { color: var(--dark-ink); }
dialog { color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-box); }
dialog::backdrop { background: var(--scrim); }
</style>
</head>
<body>
<div id="tabs" class="tabs" role="tablist" hidden></div>
<div class="term">
  <p id="status" role="status" hidden></p>
  <div id="emulator"></div>
</div>
<template id="close-icon">
  <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
    <path d="M2 2l6 6 M8 2L2 8"/>
  </svg>
</template>
<template id="add-icon">
  <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
    <path d="M6 2v8 M2 6h8"/>
  </svg>
</template>
<dialog id="confirm" aria-labelledby="question">
  <form method="dialog">
    <h2 id="question"></h2>
    <p id="detail"></p>
    <div class="dialog-actions">
      <button class="btn" value="cancel" autofocus data-i18n="common.cancel"></button>
      <button class="btn primary" id="confirm-action" value="confirm"></button>
    </div>
  </form>
</dialog>
<!--page-->
<script type="module" src="./terminal.js"></script>
</body>
</html>
